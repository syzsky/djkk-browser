name: Build APK

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: "车机白名单包名（默认 com.baidu.searchbox）"
        required: false
        default: "com.baidu.searchbox"
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: |
          chmod +x build.sh
          PKG="${{ github.event.inputs.pkg || 'com.baidu.searchbox' }}" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: djkk-browser-apk
          path: "*.apk"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DJKK浏览器 v1.0.${{ github.run_number }}
          files: "*.apk"
